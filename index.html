<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carte Interactive & Itinéraire Routier</title>

  <!-- 1. Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <!-- 2. Leaflet Routing Machine CSS (Itinéraires) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
  
  <!-- 3. Leaflet Control Geocoder CSS (Recherche d'adresses) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />

  <style>
    * {
      box-sizing: border-box;
    }
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-family: Arial, sans-serif;
    }
    #map {
      height: 100vh;
      width: 100%;
    }
    /* Personnalisation du panneau d'itinéraire */
    .leaflet-routing-container {
      background-color: white;
      padding: 10px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      max-width: 320px;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- 1. Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- 2. Leaflet Routing Machine JS -->
  <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
  
  <!-- 3. Leaflet Control Geocoder JS -->
  <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

  <script>
    // 1. Initialisation de la carte (centrée sur le Québec par défaut)
    const map = L.map('map').setView([46.5583, -72.7478], 11);

    // 2. Couche OpenStreetMap France (garantit les toponymes en français)
    L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png', {
      maxZoom: 20,
      attribution: '&copy; OpenStreetMap France | &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    // 3. Module de recherche d'adresses (Nominatim avec réponses prioritaires en français)
    const geocoder = L.Control.Geocoder.nominatim({
      geocodingQueryParams: {
        'accept-language': 'fr'
      }
    });

    L.Control.geocoder({
      query: '',
      placeholder: 'Rechercher une adresse...',
      defaultMarkGeocode: false,
      geocoder: geocoder
    })
    .on('markgeocode', function(e) {
      const bbox = e.geocode.bbox;
      const poly = L.polygon([
        bbox.getSouthEast(),
        bbox.getNorthEast(),
        bbox.getNorthWest(),
        bbox.getSouthWest()
      ]);
      map.fitBounds(poly.getBounds());
      
      L.marker(e.geocode.center).addTo(map)
        .bindPopup(e.geocode.name)
        .openPopup();
    })
    .addTo(map);

    // 4. Module d'itinéraire routier (OSRM gratuit)
    const routingControl = L.Routing.control({
      waypoints: [
        L.latLng(46.5583, -72.7478), // Point A (ex. Shawinigan)
        L.latLng(46.3432, -72.5433)  // Point B (ex. Trois-Rivières)
      ],
      routeWhileDragging: true,
      language: 'fr', // Instructions de guidage en français
      geocoder: geocoder, // Permet de chercher directement dans les champs départ/arrivée
      collapsible: true   // Permet de réduire le panneau d'itinéraire
    }).addTo(map);
  </script>

</body>
</html>
