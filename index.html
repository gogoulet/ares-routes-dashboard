<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Tableau de bord des routes</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      
      --status-green: #22c55e;
      --status-yellow: #eab308;
      --status-red: #ef4444;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 2rem;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    h1 { margin: 0; font-size: 1.5rem; }

    .btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn:hover { background: #1d4ed8; }
    .btn-secondary { background: #475569; }
    .btn-secondary:hover { background: #334155; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
    }

    th { color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; }

    .status-badge {
      display: inline-block;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      margin-right: 0.5rem;
    }
    .status-green { background-color: var(--status-green); box-shadow: 0 0 8px var(--status-green); }
    .status-yellow { background-color: var(--status-yellow); box-shadow: 0 0 8px var(--status-yellow); }
    .status-red { background-color: var(--status-red); box-shadow: 0 0 8px var(--status-red); }

    .form-group {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }

    input, select {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem;
      border-radius: 4px;
      flex: 1;
      min-width: 150px;
    }

    .disabled-row {
      opacity: 0.4;
    }

    .action-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Tableau de bord des routes</h1>
    <button class="btn btn-secondary" onclick="resetToDefaults()">Réinitialiser aux valeurs par défaut</button>
  </header>

  <!-- Formulaire d'ajout -->
  <div class="card">
    <h3>Ajouter une nouvelle route</h3>
    <form id="add-route-form" onsubmit="addRoute(event)" class="form-group">
      <input type="text" id="new-name" placeholder="Nom de la route" required>
      <input type="text" id="new-path" placeholder="Chemin (/api/v1/...)" required>
      <input type="text" id="new-contact" placeholder="Contact responsable" required>
      <select id="new-status">
        <option value="green">Vert (Opérationnel)</option>
        <option value="yellow">Jaune (Dégradé)</option>
        <option value="red">Rouge (Hors service)</option>
      </select>
      <button type="submit" class="btn">Ajouter</button>
    </form>
  </div>

  <!-- Tableau des routes -->
  <div class="card">
    <table>
      <thead>
        <tr>
          <th>Statut</th>
          <th>Nom / Chemin</th>
          <th>Contact</th>
          <th>État</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="routes-table-body">
        <!-- Rempli dynamiquement en JS -->
      </tbody>
    </table>
  </div>
</div>

<script>
  // 1. Définition des routes permanentes intégrées dans le code
  const DEFAULT_ROUTES = [
    { id: 1, name: "API Authentification", path: "/api/auth", status: "green", contact: "Alexandre M.", active: true },
    { id: 2, name: "Paiements & Facturation", path: "/api/billing", status: "yellow", contact: "Sophie T.", active: true },
    { id: 3, name: "Service de Notifications", path: "/api/notifications", status: "red", contact: "DevOps Team", active: false }
  ];

  // Chargement des données (depuis LocalStorage ou par défaut)
  let routes = JSON.parse(localStorage.getItem('dashboard_routes')) || DEFAULT_ROUTES;

  function saveAndRender() {
    localStorage.setItem('dashboard_routes', JSON.stringify(routes));
    render();
  }

  function render() {
    const tbody = document.getElementById('routes-table-body');
    tbody.innerHTML = '';

    routes.forEach(route => {
      const tr = document.createElement('tr');
      if (!route.active) tr.classList.add('disabled-row');

      tr.innerHTML = `
        <td>
          <span class="status-badge status-${route.status}"></span>
          <select onchange="updateStatus(${route.id}, this.value)">
            <option value="green" ${route.status === 'green' ? 'selected' : ''}>Vert</option>
            <option value="yellow" ${route.status === 'yellow' ? 'selected' : ''}>Jaune</option>
            <option value="red" ${route.status === 'red' ? 'selected' : ''}>Rouge</option>
          </select>
        </td>
        <td>
          <strong>${escapeHtml(route.name)}</strong><br>
          <small style="color: var(--text-muted)">${escapeHtml(route.path)}</small>
        </td>
        <td>
          <input type="text" value="${escapeHtml(route.contact)}" 
                 onchange="updateContact(${route.id}, this.value)" 
                 style="width: 100%; min-width: auto;">
        </td>
        <td>
          <label>
            <input type="checkbox" ${route.active ? 'checked' : ''} onchange="toggleActive(${route.id})">
            ${route.active ? 'Active' : 'Inactive'}
          </label>
        </td>
        <td>
          <button class="action-btn" onclick="deleteRoute(${route.id})">Supprimer</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  // --- Actions ---

  function updateStatus(id, newStatus) {
    const route = routes.find(r => r.id === id);
    if (route) {
      route.status = newStatus;
      saveAndRender();
    }
  }

  function updateContact(id, newContact) {
    const route = routes.find(r => r.id === id);
    if (route) {
      route.contact = newContact;
      saveAndRender();
    }
  }

  function toggleActive(id) {
    const route = routes.find(r => r.id === id);
    if (route) {
      route.active = !route.active;
      saveAndRender();
    }
  }

  function addRoute(e) {
    e.preventDefault();
    const newRoute = {
      id: Date.now(),
      name: document.getElementById('new-name').value,
      path: document.getElementById('new-path').value,
      contact: document.getElementById('new-contact').value,
      status: document.getElementById('new-status').value,
      active: true
    };
    routes.push(newRoute);
    saveAndRender();
    
    // Réinitialisation du formulaire
    document.getElementById('add-route-form').reset();
  }

  function deleteRoute(id) {
    routes = routes.filter(r => r.id !== id);
    saveAndRender();
  }

  function resetToDefaults() {
    if (confirm("Réinitialiser le tableau de bord avec les routes de base intégrées au code ?")) {
      routes = [...DEFAULT_ROUTES];
      saveAndRender();
    }
  }

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]);
  }

  // Premier rendu
  render();
</script>

</body>
</html>
