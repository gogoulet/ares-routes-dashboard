<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Tableau de Bord des Routes Ares</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      
      --status-green: #22c55e;
      --status-yellow: #eab308;
      --status-red: #ef4444;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 2rem;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    h1 { margin: 0; font-size: 1.6rem; }

    .btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn:hover { background: #1d4ed8; }
    .btn-secondary { background: #475569; }
    .btn-secondary:hover { background: #334155; }
    .btn-danger { background: #dc2626; }
    .btn-danger:hover { background: #b91c1c; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 0.75rem 0.5rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }

    th { color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; }

    .status-badge {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 0.4rem;
      vertical-align: middle;
    }
    .status-vert { background-color: var(--status-green); box-shadow: 0 0 8px var(--status-green); }
    .status-jaune { background-color: var(--status-yellow); box-shadow: 0 0 8px var(--status-yellow); }
    .status-rouge { background-color: var(--status-red); box-shadow: 0 0 8px var(--status-red); }

    .color-dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 3px;
      margin-right: 0.4rem;
      vertical-align: middle;
    }

    .form-group {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }

    input, select {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem;
      border-radius: 4px;
      flex: 1;
      min-width: 130px;
    }

    .disabled-row {
      opacity: 0.35;
    }

    .action-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: #f87171;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      cursor: pointer;
    }
    .action-btn:hover { background: rgba(239, 68, 68, 0.1); }

    .coord-text {
      font-family: monospace;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Tableau de Bord des Routes (<span id="route-count">0</span>)</h1>
    <button class="btn btn-secondary" onclick="resetToDefaults()">Réinitialiser aux 81 routes de base</button>
  </header>

  <!-- Formulaire d'ajout -->
  <div class="card">
    <h3>Ajouter une nouvelle route</h3>
    <form id="add-route-form" onsubmit="addRoute(event)" class="form-group">
      <input type="text" id="new-name" placeholder="Nom (ex: Paris - Lyon)" required>
      <input type="text" id="new-start" placeholder="Départ Lat, Lng (ex: 48.85, 2.35)" required>
      <input type="text" id="new-end" placeholder="Arrivée Lat, Lng (ex: 45.76, 4.83)" required>
      <input type="text" id="new-contact" placeholder="Contact" value="David Ross" required>
      <select id="new-status">
        <option value="vert">Vert (Opérationnel)</option>
        <option value="jaune">Jaune (Dégradé)</option>
        <option value="rouge">Rouge (Hors service)</option>
      </select>
      <input type="color" id="new-color" value="#3b82f6" style="min-width: 50px; cursor: pointer;">
      <button type="submit" class="btn">Ajouter</button>
    </form>
  </div>

  <!-- Tableau des routes -->
  <div class="card">
    <table>
      <thead>
        <tr>
          <th>Statut</th>
          <th>Nom de la route</th>
          <th>Coordonnées (Départ / Arrivée)</th>
          <th>Contact</th>
          <th>État</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="routes-table-body">
        <!-- Rempli dynamiquement en JS -->
      </tbody>
    </table>
  </div>
</div>

  // Initialisation des routes par défaut avec 'active: true'
  const DEFAULT_ROUTES = JSON.parse(RAW_ARES_ROUTES).map(item => ({
    ...item,
    active: item.active !== undefined ? item.active : true
  }));

  // Charger depuis le stockage local ou charger la liste intégrée en dur
  let routes = JSON.parse(localStorage.getItem('ares_routes_dashboard')) || DEFAULT_ROUTES;

  function saveAndRender() {
    localStorage.setItem('ares_routes_dashboard', JSON.stringify(routes));
    render();
  }

  function render() {
    const tbody = document.getElementById('routes-table-body');
    document.getElementById('route-count').innerText = routes.length;
    tbody.innerHTML = '';

    routes.forEach(route => {
      const tr = document.createElement('tr');
      if (!route.active) tr.classList.add('disabled-row');

      const startCoord = Array.isArray(route.start) ? route.start.join(', ') : '';
      const endCoord = Array.isArray(route.end) ? route.end.join(', ') : '';

      tr.innerHTML = `
        <td>
          <span class="status-badge status-${route.status}"></span>
          <select onchange="updateStatus(${route.id}, this.value)">
            <option value="vert" ${route.status === 'vert' ? 'selected' : ''}>Vert</option>
            <option value="jaune" ${route.status === 'jaune' ? 'selected' : ''}>Jaune</option>
            <option value="rouge" ${route.status === 'rouge' ? 'selected' : ''}>Rouge</option>
          </select>
        </td>
        <td>
          <span class="color-dot" style="background-color: ${route.color || '#3b82f6'};"></span>
          <strong>${escapeHtml(route.name)}</strong>
        </td>
        <td class="coord-text">
          D: [${startCoord}]<br>
          A: [${endCoord}]
        </td>
        <td>
          <input type="text" value="${escapeHtml(route.contact || '')}" 
                 onchange="updateContact(${route.id}, this.value)" 
                 style="width: 100%; min-width: auto;">
        </td>
        <td>
          <label style="cursor: pointer;">
            <input type="checkbox" ${route.active ? 'checked' : ''} onchange="toggleActive(${route.id})">
            ${route.active ? 'Active' : 'Masquée'}
          </label>
        </td>
        <td>
          <button class="action-btn" onclick="deleteRoute(${route.id})">Supprimer</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  // --- Fonctions de gestion ---

  function updateStatus(id, newStatus) {
    const route = routes.find(r => r.id === id);
    if (route) {
      route.status = newStatus;
      saveAndRender();
    }
  }

  function updateContact(id, newContact) {
    const route = routes.find(r => r.id === id);
    if (route) {
      route.contact = newContact;
      saveAndRender();
    }
  }

  function toggleActive(id) {
    const route = routes.find(r => r.id === id);
    if (route) {
      route.active = !route.active;
      saveAndRender();
    }
  }

  function addRoute(e) {
    e.preventDefault();
    
    const startInput = document.getElementById('new-start').value.split(',').map(n => parseFloat(n.trim()));
    const endInput = document.getElementById('new-end').value.split(',').map(n => parseFloat(n.trim()));

    const newRoute = {
      id: Date.now(),
      name: document.getElementById('new-name').value,
      start: startInput.length === 2 && !isNaN(startInput[0]) ? startInput : [0, 0],
      end: endInput.length === 2 && !isNaN(endInput[0]) ? endInput : [0, 0],
      contact: document.getElementById('new-contact').value,
      status: document.getElementById('new-status').value,
      color: document.getElementById('new-color').value,
      active: true
    };

    routes.unshift(newRoute);
    saveAndRender();
    document.getElementById('add-route-form').reset();
  }

  function deleteRoute(id) {
    if (confirm("Voulez-vous supprimer cette route ?")) {
      routes = routes.filter(r => r.id !== id);
      saveAndRender();
    }
  }

  function resetToDefaults() {
    if (confirm("Réinitialiser avec les 81 routes permanentes d'origine ?")) {
      routes = JSON.parse(JSON.stringify(DEFAULT_ROUTES));
      saveAndRender();
    }
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]);
  }

  // Lancement initial
  render();
</script>
